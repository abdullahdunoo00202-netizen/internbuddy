<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InternBuddy</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/splash.css') }}">

    <style>
        video {
            width: 100%;
            max-width: 700px;
            display: block;
            margin: 25px auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>

<div class="bg"></div>

<div class="content">
    <h1>InternBuddy</h1>
    <p>Smart Internship Partner</p>

    <!-- ✅ DEBUG + FINAL VIDEO -->
    <video id="introVideo" muted playsinline controls>
        <source src="/static/video/intro.mp4" type="video/mp4">
    </video>
</div>

<script>
    const video = document.getElementById("introVideo");

    // 🔥 Jab video load ho jaye → autoplay force karo
    video.oncanplay = () => {
        video.play().catch(() => {});
    };

    // 🔥 Safe redirect (video ko time milta hai)
    setTimeout(() => {
        window.location.href = "/auth";
    }, 8000);   // 🔥 8 seconds
</script>

</body>
</html>
