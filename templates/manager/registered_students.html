<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registered Students</title>

    <link rel="stylesheet" href="/static/css/student_dashboard.css">
    <link rel="stylesheet" href="/static/css/manager_dashboard.css">
</head>
<body>

<!-- ===== TOP BAR ===== -->
<div class="top-bar">
    <button class="top-btn" onclick="location.href='/manager/dashboard'">
        ⬅ Back to Dashboard
    </button>

    <h2>Registered Students</h2>

    <button class="top-btn logout" id="logoutBtn">
        Logout
    </button>
</div>

<!-- ===== MAIN CONTENT ===== -->
<div class="page-container">

    <div class="table-container">
        <table class="styled-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Student Name</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="studentsTable">
                <tr>
                    <td colspan="3">Loading students...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="/static/js/manager_registered_students.js"></script>
</body>
</html>
