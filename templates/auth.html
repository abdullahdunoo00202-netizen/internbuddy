<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InternBuddy | Auth</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

<div class="auth-layout">

    <!-- LEFT PANEL (AUTH FORMS) -->
    <div class="auth-panel">

        <div class="auth-wrapper">

            <h1 class="logo">InternBuddy</h1>
            <p class="tagline">Smart Internship Partner</p>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="card">
                <h2>Login</h2>

                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>

                <button type="submit">Login</button>

                <p class="switch">
                    Don’t have an account?
                    <span id="showRegister">Create Account</span>
                </p>

                <a href="/forgot-password" class="forgot">Forgot password?</a>
            </form>

            <!-- REGISTER FORM -->
            <form id="registerForm" class="card hidden">
                <h2>Create Account</h2>

                <input type="text" id="name" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>

                <select id="role">
                    <option value="student">Student</option>
                    <option value="manager">Manager</option>
                </select>

                <button type="submit">Register</button>

                <p class="switch">
                    Already have an account?
                    <span id="showLogin">Login</span>
                </p>
            </form>

        </div>
    </div>

    <!-- RIGHT PANEL (ILLUSTRATION) -->
    <div class="illustration-panel">
        <img src="{{ url_for('static', filename='images/internship.svg') }}" alt="Internship">
        <h2>Your Smart Internship Partner</h2>
        <p>
            InternBuddy helps students find, manage and track internships
            using smart AI-powered recommendations.
        </p>
    </div>

</div>

<!-- ✅ FIXED SCRIPT TAG -->
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>
</html>
